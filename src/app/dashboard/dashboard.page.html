<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>dashboard</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">dashboard</ion-title>
    </ion-toolbar>
  </ion-header>
  
  <ion-datetime
  presentation="date"
  (ionChange)="onDataChange($event)"
  ></ion-datetime>
  <div *ngIf="dados.length === 0" class="ion-text-center ion-padding">
    <p>Nenhum registro encontrado para a data selecionada.</p>
  </div>
  

  <ion-card *ngFor="let i of dados">
    <ion-card-header>
      <ion-card-title>Registro: {{i["timestamp"]}}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label>Umidade: {{i["umidade"]}}</ion-label>
        </ion-item>
        <ion-item>
          <ion-label>Temperatura: {{i["temperatura"]}}</ion-label>
        </ion-item>
        <ion-item>
          <ion-label>Turbidez: {{i["turbidez"]}}</ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>


</ion-content>
